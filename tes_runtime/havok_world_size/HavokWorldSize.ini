[General]
; Half-extent of the Havok broad-phase world, in cells. Vanilla is 64.
; The broad-phase key step is 2*half_extent/65536 units and DOUBLES every
; time you double this, so use the SMALLEST value that covers your worldspace:
;   64  = 8 u step   (vanilla Skyrim)
;   128 = 16 u step  (WrldMorrowind, worst cell 116)
;   192 = 24 u step  (TES4Tamriel, worst cell 192)
fWorldCells=128

; 1 = find and log the constant but change nothing.
bDryRun=0
